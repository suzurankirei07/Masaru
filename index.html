<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お父さんアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🩵 お父さんへ</h1>

<div class="container">

    <button onclick="speak('ごはんが食べたいです')">
        🍚<br>ごはん
    </button>

    <button onclick="speak('水が飲みたいです')">
        💧<br>水
    </button>

    <button onclick="speak('トイレに行きたいです')">
        🚽<br>トイレ
    </button>

    <button onclick="speak('痛いです')">
        😖<br>痛い
    </button>

    <button onclick="speak('大丈夫です')">
        😊<br>大丈夫
    </button>

    <button onclick="speak('お願いします')">
        🙏<br>お願い
    </button>

    <button onclick="speak('家族に会いたいです')">
        ❤️<br>家族
    </button>

    <button onclick="speak('シマに会いたいです')">
        🐱<br>シマ
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
